name: 发布 GHCR 镜像

on:
  push:
    branches:
      # main 合并后发布稳定内测标签；首次接入时也允许当前功能分支先完成真实推送验证。
      - main
      - agent/container-images
    tags:
      - "trial-v*"
      - "v*"
  workflow_dispatch:

# 默认仓库工作流权限是只读，因此在本工作流内显式申请写入 Packages。
# GITHUB_TOKEN 只用于当前仓库关联的 GHCR 包，不需要保存长期推送密钥。
permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/hakka-stage-ai

jobs:
  build-and-push:
    name: 构建并推送 ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            build_args: ""
          - component: worker
            context: ./worker
            dockerfile: ./worker/Dockerfile
            build_args: ""
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile.production
            # 生产前端通过同域反向代理访问 /api 和 /health，不把服务器域名写死进镜像。
            build_args: VITE_API_BASE_URL=/

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          # 始终保留 commit 标签；Git 标签原样同步；main 额外维护 trial 便捷标签。
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=trial,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
