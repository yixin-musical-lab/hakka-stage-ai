server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router 使用浏览器端路由。直接刷新详情页时若没有静态文件，
    # 应回退到 index.html，再由前端根据 URL 渲染对应页面。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 该端点只用于 Docker / 编排平台检查静态服务是否存活，
    # 业务后端健康状态仍由 FastAPI 的 /health 独立检查。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
