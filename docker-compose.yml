services:
  postgres:
    image: postgres:16-alpine
    container_name: hakka-stage-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hakka_stage_ai}
      POSTGRES_USER: ${POSTGRES_USER:-hakka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hakka_password}
    ports:
      # 宿主机端口与容器内数据库端口分离，避免 Windows 动态保留 5432 时连带改坏服务间连接。
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hakka} -d ${POSTGRES_DB:-hakka_stage_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hakka-stage-ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: hakka-stage-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: hakka-stage-ai-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-hakka-stage-ai}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-local-dev-only-change-me-at-least-32-bytes}
      AUTH_ACCESS_TOKEN_MINUTES: ${AUTH_ACCESS_TOKEN_MINUTES:-480}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BOOTSTRAP_ACCOUNT_EMAIL: ${BOOTSTRAP_ACCOUNT_EMAIL:-}
      BOOTSTRAP_ACCOUNT_PASSWORD: ${BOOTSTRAP_ACCOUNT_PASSWORD:-}
      BOOTSTRAP_ACCOUNT_DISPLAY_NAME: ${BOOTSTRAP_ACCOUNT_DISPLAY_NAME:-平台初始账号}
      BOOTSTRAP_ACCOUNT_ROLE: ${BOOTSTRAP_ACCOUNT_ROLE:-teacher}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hakka_stage_ai}
      POSTGRES_USER: ${POSTGRES_USER:-hakka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hakka_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-hakka-stage-ai}
      M08_VIDEO_MAX_UPLOAD_MB: ${M08_VIDEO_MAX_UPLOAD_MB:-200}
      MEDIA_MAX_UPLOAD_MB: ${MEDIA_MAX_UPLOAD_MB:-200}
      MEDIA_MOCK_MODE: ${MEDIA_MOCK_MODE:-true}
      GRSAI_API_KEY: ${GRSAI_API_KEY:-}
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsai.dakka.com.cn}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_BASE_URL: ${RUNNINGHUB_BASE_URL:-https://www.runninghub.cn}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # Wan 2.7 使用百炼原生异步视频接口，不复用 QWEN_BASE_URL 的 OpenAI 兼容路径。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      VIDEO_PUBLIC_BASE_URL: ${VIDEO_PUBLIC_BASE_URL:-}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-30}
      VIDEO_MOCK_MODE: ${VIDEO_MOCK_MODE:-}
      VIDEO_IMAGE_MAX_UPLOAD_MB: ${VIDEO_IMAGE_MAX_UPLOAD_MB:-20}
      MOTION_IMAGE_MAX_UPLOAD_MB: ${MOTION_IMAGE_MAX_UPLOAD_MB:-5}
      MOTION_VIDEO_MAX_UPLOAD_MB: ${MOTION_VIDEO_MAX_UPLOAD_MB:-200}
      MOTION_RESULT_MAX_DOWNLOAD_MB: ${MOTION_RESULT_MAX_DOWNLOAD_MB:-500}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-deepseek}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      LLM_DEFAULT_REASONING_LEVEL: ${LLM_DEFAULT_REASONING_LEVEL:-standard}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      GRSAI_PUBLIC_BASE_URL: ${GRSAI_PUBLIC_BASE_URL:-}
      GRSAI_TIMEOUT_SECONDS: ${GRSAI_TIMEOUT_SECONDS:-30}
      GRSAI_MOCK_MODE: ${GRSAI_MOCK_MODE:-false}
      GRSAI_IMAGE_MAX_UPLOAD_MB: ${GRSAI_IMAGE_MAX_UPLOAD_MB:-10}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./worker
    container_name: hakka-stage-ai-worker
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-hakka-stage-ai}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-hakka_stage_ai}
      POSTGRES_USER: ${POSTGRES_USER:-hakka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hakka_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-hakka-stage-ai}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-deepseek}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-deepseek-v4-flash}
      LLM_DEFAULT_REASONING_LEVEL: ${LLM_DEFAULT_REASONING_LEVEL:-standard}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      MEDIA_MOCK_MODE: ${MEDIA_MOCK_MODE:-true}
      MEDIA_HTTP_TIMEOUT_SECONDS: ${MEDIA_HTTP_TIMEOUT_SECONDS:-120}
      MEDIA_POLL_INTERVAL_SECONDS: ${MEDIA_POLL_INTERVAL_SECONDS:-5}
      MEDIA_POLL_MAX_COUNT: ${MEDIA_POLL_MAX_COUNT:-720}
      GRSAI_API_KEY: ${GRSAI_API_KEY:-}
      GRSAI_BASE_URL: ${GRSAI_BASE_URL:-https://grsai.dakka.com.cn}
      GRSAI_POLL_INTERVAL_SECONDS: ${GRSAI_POLL_INTERVAL_SECONDS:-15}
      GRSAI_POLL_MAX_COUNT: ${GRSAI_POLL_MAX_COUNT:-400}
      RUNNINGHUB_API_KEY: ${RUNNINGHUB_API_KEY:-}
      RUNNINGHUB_BASE_URL: ${RUNNINGHUB_BASE_URL:-https://www.runninghub.cn}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "conda", "run", "--no-capture-output", "-n", "hakka-worker", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-auto}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-auto}
    container_name: hakka-stage-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
