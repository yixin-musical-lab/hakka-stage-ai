[project]
name = "hakka-stage-ai-backend"
version = "0.1.0"
description = "FastAPI API service for hakka-stage-ai."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "redis>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[tool.uv]
# 后端当前只作为 API 服务运行，不需要把 app 安装成 Python 包。
package = false
